<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return v.stack || (v.name + ': ' + v.message);
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Poll Kilat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css with Docker or Paketo on every image build.
       Class names are written as whole literals (also inside JS strings
       below) so the compiler's extractor sees them. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path.
       Not conditional on calling a bridge API: it is also how the app
       ANSWERS the shell (offline launch, background tint reporting). -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <style>
    /* Result bars animate from 0 to their share when results render. */
    .bar { transition: width 600ms cubic-bezier(0.22, 1, 0.36, 1); }
    @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
  </style>
</head>
<body class="flex min-h-screen flex-col bg-zinc-950 text-zinc-100">
  <header class="sticky top-0 z-20 border-b border-zinc-800 bg-zinc-950/85 backdrop-blur">
    <div class="mx-auto flex h-14 w-full max-w-md items-center justify-between gap-3 px-4">
      <div class="flex min-w-0 items-center gap-1">
        <button id="back-btn" type="button" aria-label="Back"
          class="hidden rounded-full p-2 text-zinc-400 transition-colors hover:text-zinc-100">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12.7 4.3a1 1 0 0 1 0 1.4L8.4 10l4.3 4.3a1 1 0 0 1-1.4 1.4l-5-5a1 1 0 0 1 0-1.4l5-5a1 1 0 0 1 1.4 0Z" clip-rule="evenodd"/></svg>
        </button>
        <h1 id="hdr-title" class="truncate text-lg font-bold">Poll Kilat</h1>
      </div>
      <a id="new-btn" href="/new" data-nav
        class="shrink-0 rounded-full bg-violet-600 px-4 py-2 text-sm font-semibold text-white transition-all hover:bg-violet-500 active:scale-95">New poll</a>
    </div>
  </header>

  <main id="view" class="mx-auto flex w-full max-w-md flex-1 flex-col gap-4 px-4 py-5"></main>

  <script>
  (function () {
    'use strict';

    // The shell mints the user token and appends it as ?token= on the first
    // load. Keep it (localStorage) so in-app navigation and reloads keep
    // working, and re-attach it when navigating so a refresh never loses it.
    var TOKEN = '';
    try {
      var qs = new URLSearchParams(location.search);
      TOKEN = qs.get('token') || localStorage.getItem('pk_token') || '';
      if (qs.get('token')) localStorage.setItem('pk_token', TOKEN);
    } catch (e) {}

    var view = document.getElementById('view');
    var hdrTitle = document.getElementById('hdr-title');
    var backBtn = document.getElementById('back-btn');
    var newBtn = document.getElementById('new-btn');

    var detailTimer = null;
    var currentDetailPollId = null;
    var voting = false;
    var creating = false;
    var navigated = false;

    function api(path, opts) {
      var headers = { 'Content-Type': 'application/json' };
      if (TOKEN) headers['x-usernode-token'] = TOKEN;
      return fetch(path, Object.assign({ headers: headers }, opts || {})).then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) {
            var err = new Error(data.error || 'Something went wrong');
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function timeAgo(iso) {
      var s = (Date.now() - new Date(iso).getTime()) / 1000;
      if (!isFinite(s) || s < 0) return 'just now';
      if (s < 60) return 'just now';
      var m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      var h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    function votes(n) { return n === 1 ? '1 vote' : n + ' votes'; }

    function setHeader(title, opts) {
      opts = opts || {};
      hdrTitle.textContent = title;
      backBtn.classList.toggle('hidden', !opts.back);
      newBtn.classList.toggle('hidden', !opts.newBtn);
    }

    // Double rAF so bars paint at 0% first, then transition to their share.
    function animateBars() {
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          view.querySelectorAll('.bar[data-w]').forEach(function (el) {
            el.style.width = el.getAttribute('data-w');
          });
        });
      });
    }

    function sessionCard() {
      return '<div class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 text-center">' +
        '<p class="text-sm text-zinc-300">Your session has ended. Open this app again from Homeroom to keep voting.</p>' +
      '</div>';
    }

    function errorCard(message, retry) {
      return '<div class="rounded-2xl border border-zinc-800 bg-zinc-900/60 p-6 text-center">' +
        '<p class="text-sm text-zinc-300">' + esc(message) + '</p>' +
        (retry ? '<button type="button" data-retry class="mt-4 rounded-full border border-zinc-700 px-4 py-2 text-sm font-medium text-zinc-200 transition-colors hover:border-zinc-500">Try again</button>' : '') +
      '</div>';
    }

    var loadingCard = '<p class="px-1 text-sm text-zinc-500">Loading polls…</p>';

    // ── Poll list ───────────────────────────────────────────────────────

    function pollCard(p) {
      var maxVotes = 0;
      p.options.forEach(function (o) { if (o.votes > maxVotes) maxVotes = o.votes; });
      var rows = p.options.map(function (o) {
        var pct = p.total > 0 ? Math.round((o.votes / p.total) * 100) : 0;
        var lead = o.votes > 0 && o.votes === maxVotes;
        return '<div class="flex flex-col gap-1">' +
          '<div class="flex items-center justify-between gap-2 text-sm">' +
            '<span class="truncate text-zinc-300">' + esc(o.label) + '</span>' +
            '<span class="shrink-0 tabular-nums text-zinc-500">' + o.votes + '</span>' +
          '</div>' +
          '<div class="h-1.5 overflow-hidden rounded-full bg-zinc-800">' +
            '<div class="bar h-full rounded-full ' + (lead ? 'bg-violet-500' : 'bg-zinc-600') + '" style="width:0%" data-w="' + pct + '%"></div>' +
          '</div>' +
        '</div>';
      }).join('');
      var chip = p.myOptionId != null
        ? '<span class="shrink-0 rounded-full bg-violet-600/20 px-2.5 py-0.5 text-xs font-medium text-violet-300">Voted</span>'
        : '';
      return '<a href="/poll/' + p.id + '" data-nav ' +
        'class="poll-card block rounded-2xl border border-zinc-800 bg-zinc-900/60 p-5 transition-colors hover:border-zinc-700">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<h2 class="text-base font-semibold leading-snug">' + esc(p.question) + '</h2>' + chip +
        '</div>' +
        '<div class="mt-3 flex flex-col gap-2.5">' + rows + '</div>' +
        '<p class="mt-3 text-xs text-zinc-500">' + votes(p.total) + ' · ' + timeAgo(p.createdAt) + '</p>' +
      '</a>';
    }

    function renderList() {
      setHeader('Poll Kilat', { newBtn: true });
      view.innerHTML = loadingCard;
      api('/api/polls').then(function (data) {
        if (!data.polls.length) {
          view.innerHTML =
            '<div class="flex flex-col items-center gap-4 rounded-2xl border border-zinc-800 bg-zinc-900/60 p-8 text-center">' +
              '<p class="text-sm text-zinc-400">No polls yet</p>' +
              '<a href="/new" data-nav class="rounded-full bg-violet-600 px-5 py-2.5 text-sm font-semibold text-white transition-all hover:bg-violet-500 active:scale-95">Create the first poll</a>' +
            '</div>';
          return;
        }
        view.innerHTML = data.polls.map(pollCard).join('');
        animateBars();
      }).catch(function (err) {
        view.innerHTML = err.status === 401 ? sessionCard() : errorCard('Could not load polls. ' + err.message, true);
      });
    }

    // ── Poll detail: one-tap vote + live results ────────────────────────

    function optionResults(p) {
      var maxVotes = 0;
      p.options.forEach(function (o) { if (o.votes > maxVotes) maxVotes = o.votes; });
      return p.options.map(function (o) {
        var pct = p.total > 0 ? Math.round((o.votes / p.total) * 100) : 0;
        var mine = o.id === p.myOptionId;
        var lead = o.votes > 0 && o.votes === maxVotes;
        return '<div class="option-row rounded-xl border px-4 py-3 ' + (mine ? 'border-violet-500/70 bg-violet-600/10' : 'border-zinc-800 bg-zinc-900') + '">' +
          '<div class="flex items-center justify-between gap-2 text-sm">' +
            '<span class="flex min-w-0 items-center gap-2">' +
              '<span class="truncate font-medium text-zinc-100">' + esc(o.label) + '</span>' +
              (mine ? '<span class="shrink-0 rounded-full bg-violet-600/20 px-2 py-0.5 text-xs font-medium text-violet-300">Your vote</span>' : '') +
            '</span>' +
            '<span class="shrink-0 tabular-nums text-zinc-400">' + o.votes + ' · ' + pct + '%</span>' +
          '</div>' +
          '<div class="mt-2 h-1.5 overflow-hidden rounded-full bg-zinc-800">' +
            '<div class="bar h-full rounded-full ' + (lead ? 'bg-violet-500' : 'bg-zinc-600') + '" style="width:0%" data-w="' + pct + '%"></div>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function renderPollDetail(p) {
      var header =
        '<div>' +
          '<h2 class="text-xl font-bold leading-snug">' + esc(p.question) + '</h2>' +
          '<p class="mt-1 text-xs text-zinc-500">by @' + esc(p.username) + ' · ' + timeAgo(p.createdAt) + '</p>' +
        '</div>';
      var body;
      if (p.myOptionId == null) {
        var buttons = p.options.map(function (o) {
          return '<button type="button" data-option="' + o.id + '" ' +
            'class="option-row w-full rounded-xl border border-zinc-700 bg-zinc-900 px-4 py-3.5 text-left text-sm font-medium text-zinc-100 transition-all hover:border-violet-500/70 hover:bg-zinc-800/60 active:scale-95">' +
            esc(o.label) +
          '</button>';
        }).join('');
        body =
          '<p class="text-sm text-zinc-400">Tap an option to vote. Results appear instantly.</p>' +
          '<div class="flex flex-col gap-2.5">' + buttons + '</div>';
      } else {
        body =
          '<p class="text-sm text-zinc-400">' + votes(p.total) + ' · results update live</p>' +
          '<div class="flex flex-col gap-2.5">' + optionResults(p) + '</div>';
      }
      view.innerHTML =
        '<div class="flex flex-col gap-4 rounded-2xl border border-zinc-800 bg-zinc-900/60 p-5">' +
          header + body +
          '<p id="detail-err" class="hidden text-sm text-red-400"></p>' +
        '</div>';
      animateBars();
    }

    function renderDetail(id) {
      setHeader('Poll', { back: true, newBtn: false });
      currentDetailPollId = id;
      view.innerHTML = loadingCard;
      var load = function () {
        api('/api/polls/' + id).then(function (data) {
          renderPollDetail(data.poll);
        }).catch(function (err) {
          view.innerHTML = err.status === 404
            ? errorCard('This poll no longer exists.', true)
            : (err.status === 401 ? sessionCard() : errorCard('Could not load the poll. ' + err.message, true));
        });
      };
      load();
      if (detailTimer) clearInterval(detailTimer);
      // Live results: re-fetch while the viewer sits on this poll.
      detailTimer = setInterval(function () {
        if (document.hidden || voting) return;
        api('/api/polls/' + id).then(function (data) {
          renderPollDetail(data.poll);
        }).catch(function () {});
      }, 5000);
    }

    function vote(pollId, optionId) {
      if (voting) return;
      voting = true;
      api('/api/polls/' + pollId + '/vote', {
        method: 'POST',
        body: JSON.stringify({ optionId: optionId }),
      }).then(function (data) {
        renderPollDetail(data.poll);
      }).catch(function (err) {
        if (err.status === 409) {
          // Already voted (another device): fall back to the results view.
          api('/api/polls/' + pollId).then(function (d) { renderPollDetail(d.poll); }).catch(function () {});
          return;
        }
        var el = document.getElementById('detail-err');
        if (el) {
          el.textContent = err.status === 401
            ? 'Your session has ended. Open the app again from Homeroom.'
            : err.message;
          el.classList.remove('hidden');
        }
      }).finally(function () { voting = false; });
    }

    // ── Create poll ─────────────────────────────────────────────────────

    var xIcon = '<svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M6.28 6.28a.75.75 0 0 1 1.06 0L10 8.94l2.66-2.66a.75.75 0 1 1 1.06 1.06L11.06 10l2.66 2.66a.75.75 0 1 1-1.06 1.06L10 11.06l-2.66 2.66a.75.75 0 0 1-1.06-1.06L8.94 10 6.28 7.34a.75.75 0 0 1 0-1.06Z"/></svg>';

    function optionInputRow() {
      return '<div class="opt-row flex items-center gap-2">' +
        '<input type="text" maxlength="120" placeholder="Option text" ' +
          'class="w-full min-w-0 flex-1 rounded-xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-sm text-zinc-100 placeholder:text-zinc-600 focus:border-violet-500 focus:outline-none">' +
        '<button type="button" data-remove-option aria-label="Remove option" ' +
          'class="shrink-0 rounded-full p-2 text-zinc-500 transition-colors hover:text-zinc-200">' + xIcon + '</button>' +
      '</div>';
    }

    function refreshOptionControls(form) {
      var rows = form.querySelectorAll('.opt-row');
      rows.forEach(function (row) {
        var rm = row.querySelector('[data-remove-option]');
        if (rm) rm.classList.toggle('hidden', rows.length <= 2);
      });
      var add = form.querySelector('#add-option');
      if (add) {
        add.classList.toggle('hidden', rows.length >= 4);
      }
    }

    function renderCreate() {
      setHeader('New poll', { back: true, newBtn: false });
      view.innerHTML =
        '<form id="create-form" class="flex flex-col gap-5 rounded-2xl border border-zinc-800 bg-zinc-900/60 p-5" novalidate>' +
          '<div class="flex flex-col gap-2">' +
            '<label for="question" class="text-sm font-medium text-zinc-300">Question</label>' +
            '<input id="question" name="question" type="text" maxlength="280" placeholder="Ask something…" ' +
              'class="w-full rounded-xl border border-zinc-800 bg-zinc-950 px-4 py-3 text-sm text-zinc-100 placeholder:text-zinc-600 focus:border-violet-500 focus:outline-none">' +
            '<p id="question-err" class="hidden text-xs text-red-400">Question needs at least 3 characters.</p>' +
          '</div>' +
          '<div class="flex flex-col gap-2">' +
            '<span class="text-sm font-medium text-zinc-300">Options</span>' +
            '<div id="opt-list" class="flex flex-col gap-2">' + optionInputRow() + optionInputRow() + '</div>' +
            '<button type="button" id="add-option" class="self-start rounded-xl border border-dashed border-zinc-700 px-4 py-2 text-sm text-violet-300 transition-colors hover:border-violet-500/70">Add option</button>' +
            '<p id="options-err" class="hidden text-xs text-red-400">Fill in every option. A poll needs 2 to 4.</p>' +
          '</div>' +
          '<button type="submit" id="create-submit" ' +
            'class="w-full rounded-xl bg-violet-600 px-4 py-3.5 text-sm font-semibold text-white transition-all hover:bg-violet-500 active:scale-95">Create poll</button>' +
        '</form>';
      refreshOptionControls(view.querySelector('#create-form'));
    }

    function submitCreate(form) {
      if (creating) return;
      var questionErr = form.querySelector('#question-err');
      var optionsErr = form.querySelector('#options-err');
      var question = form.querySelector('#question').value.trim();
      var options = Array.prototype.map.call(
        form.querySelectorAll('.opt-row input'),
        function (input) { return input.value.trim(); }
      ).filter(Boolean);

      questionErr.classList.add('hidden');
      optionsErr.classList.add('hidden');

      if (question.length < 3) {
        questionErr.textContent = 'Question needs at least 3 characters.';
        questionErr.classList.remove('hidden');
        form.querySelector('#question').focus();
        return;
      }
      if (options.length < 2 || options.length > 4) {
        optionsErr.classList.remove('hidden');
        return;
      }

      creating = true;
      var submit = form.querySelector('#create-submit');
      submit.disabled = true;
      submit.classList.add('opacity-60');
      submit.textContent = 'Creating…';
      api('/api/polls', {
        method: 'POST',
        body: JSON.stringify({ question: question, options: options }),
      }).then(function (data) {
        navigate('/poll/' + data.poll.id, true);
      }).catch(function (err) {
        creating = false;
        submit.disabled = false;
        submit.classList.remove('opacity-60');
        submit.textContent = 'Create poll';
        if (err.status === 401) {
          view.innerHTML = sessionCard();
          return;
        }
        optionsErr.textContent = err.message;
        optionsErr.classList.remove('hidden');
      });
    }

    // ── Router ──────────────────────────────────────────────────────────

    function withToken(path) {
      if (!TOKEN) return path;
      return path + (path.indexOf('?') === -1 ? '?' : '&') + 'token=' + encodeURIComponent(TOKEN);
    }

    function navigate(path, replace) {
      navigated = true;
      history[replace ? 'replaceState' : 'pushState']({}, '', withToken(path));
      route();
    }

    function route() {
      if (detailTimer) { clearInterval(detailTimer); detailTimer = null; }
      var p = location.pathname;
      var m = p.match(/^\/poll\/(\d+)\/?$/);
      if (p === '/new') { renderCreate(); return; }
      if (m) { renderDetail(Number(m[1])); return; }
      renderList();
    }

    // ── Event delegation (view content is re-rendered, listeners persist) ─

    document.addEventListener('click', function (e) {
      var nav = e.target.closest('a[data-nav]');
      if (nav && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        navigate(nav.getAttribute('href'));
        return;
      }
      if (e.target.closest('#back-btn')) {
        if (navigated) history.back();
        else navigate('/', true);
        return;
      }
      var opt = e.target.closest('.option-row[data-option]');
      if (opt && currentDetailPollId != null) {
        vote(currentDetailPollId, Number(opt.getAttribute('data-option')));
      }
      if (e.target.closest('[data-retry]')) { route(); return; }
      var form = e.target.closest('#create-form');
      if (form) {
        if (e.target.closest('#add-option')) {
          var list = form.querySelector('#opt-list');
          if (list.querySelectorAll('.opt-row').length < 4) {
            list.insertAdjacentHTML('beforeend', optionInputRow());
            list.lastElementChild.querySelector('input').focus();
            refreshOptionControls(form);
          }
          return;
        }
        var rm = e.target.closest('[data-remove-option]');
        if (rm) {
          rm.closest('.opt-row').remove();
          refreshOptionControls(form);
          return;
        }
      }
    });

    view.addEventListener('submit', function (e) {
      if (e.target.id === 'create-form') {
        e.preventDefault();
        submitCreate(e.target);
      }
    });

    window.addEventListener('popstate', route);

    route();
  })();
  </script>
</body>
</html>
